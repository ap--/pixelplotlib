[project]
name = "pixelplotlib"
dynamic = ["version"]
description = "Scientific plotting with 8-bit and 16-bit pixel-art graphics"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Andreas Poehlmann", email = "andreas@poehlmann.io" },
]
maintainers = [
    { name = "Andreas Poehlmann", email = "andreas@poehlmann.io" },
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.23.2",
    "pillow>=9.2",
]
keywords = ["plotting", "visualization", "pixel-art", "8-bit", "16-bit", "retro"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Multimedia :: Graphics",
]

[project.urls]
Homepage = "https://github.com/ap--/pixelplotlib"
Source = "https://github.com/ap--/pixelplotlib"
Issues = "https://github.com/ap--/pixelplotlib/issues"
Changelog = "https://github.com/ap--/pixelplotlib/releases"

[project.optional-dependencies]
rich = [
    "rich>=12",
]
textual = [
    "textual>=0.86",
]

[dependency-groups]
dev = [
    "pytest>=7",
    "rich>=15.0.0",
    "ruff>=0.5",
    "textual>=8.2.8",
]

[build-system]
requires = ["hatchling>=1.27", "hatch-vcs>=0.5"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.uv]
# Rebuild the project when the git commit or tags change, so the VCS version stays current.
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E741", "B905"]
