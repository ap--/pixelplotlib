[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pixelplotlib"
dynamic = ["version"]
description = "Scientific plotting with 8-bit and 16-bit pixel-art graphics"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22",
    "pillow>=9.1",
]
keywords = ["plotting", "visualization", "pixel-art", "8-bit", "16-bit", "retro"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Multimedia :: Graphics",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[dependency-groups]
dev = ["pytest>=7", "ruff>=0.5"]

[tool.hatch.version]
path = "src/pixelplotlib/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pixelplotlib"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E741"]
