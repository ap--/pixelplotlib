[project]
name = "pixelplotlib"
# Placeholder for development; the publish workflow stamps the release tag here.
version = "0.1.0"
description = "Scientific plotting with 8-bit and 16-bit pixel-art graphics"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Andreas Poehlmann", email = "andreas@poehlmann.io" },
]
maintainers = [
    { name = "Andreas Poehlmann", email = "andreas@poehlmann.io" },
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.22",
    "pillow>=9.1",
]
keywords = ["plotting", "visualization", "pixel-art", "8-bit", "16-bit", "retro"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Multimedia :: Graphics",
]

[project.urls]
Homepage = "https://github.com/ap--/pixelplotlib"
Source = "https://github.com/ap--/pixelplotlib"
Issues = "https://github.com/ap--/pixelplotlib/issues"
Changelog = "https://github.com/ap--/pixelplotlib/releases"

[project.optional-dependencies]
rich = [
    "rich>=12",
]
textual = [
    "textual>=0.86",
]

[dependency-groups]
dev = [
    "pytest>=7",
    "rich>=15.0.0",
    "ruff>=0.5",
    "textual>=8.2.8",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E741", "B905"]
